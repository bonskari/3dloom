[workspace]
resolver = "2"
members = [
    "crates/loom_scene",
    "crates/loom_commands",
    "crates/loom_mesh",
    "crates/loom_fbx",
    "crates/loom_max",
    "crates/loom_shape",
    "crates/loom_input",
    "crates/loom_render",
    "crates/loom_ui",
    "crates/loom_app",
    "crates/loom_mcp",
    "crates/loom_bevy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/bonskari/3dloom"

[workspace.dependencies]
# Internal
loom_mesh   = { path = "crates/loom_mesh" }
loom_fbx    = { path = "crates/loom_fbx" }
loom_max    = { path = "crates/loom_max" }
loom_shape  = { path = "crates/loom_shape" }
loom_input  = { path = "crates/loom_input" }
loom_render = { path = "crates/loom_render" }
loom_ui     = { path = "crates/loom_ui" }
loom_scene  = { path = "crates/loom_scene" }
loom_commands = { path = "crates/loom_commands" }
loom_bevy   = { path = "crates/loom_bevy" }

# External
glam      = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck  = { version = "1.18", features = ["derive"] }
eframe    = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui      = "0.31"
egui-wgpu = "0.31"
# Phosphor icons (MIT), the Regular weight only.
egui-phosphor = { version = "0.9", default-features = false, features = ["regular"] }
wgpu      = "24.0"
pollster  = "0.4"
serde     = { version = "1", features = ["derive"] }
serde_json = "1.0"
image     = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "exr"] }
base64    = "0.22"

# Dev
proptest = "1.5"
