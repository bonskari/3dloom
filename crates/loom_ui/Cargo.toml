[package]
name    = "loom_ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bevy_tasks = { version = "0.16" }
loom_shape  = { workspace = true }
loom_mesh   = { workspace = true }
loom_commands = { workspace = true }
loom_scene  = { workspace = true }
serde_json  = { workspace = true }
log = "0.4"
ureq = { version = "2", features = ["json"] }
url = "2"
image = { workspace = true }
loom_render = { workspace = true }
loom_bevy   = { workspace = true }
loom_bake   = { workspace = true }
loom_input  = { workspace = true }
eframe      = { workspace = true }
egui        = { workspace = true }
egui-wgpu   = { workspace = true }
egui-phosphor = { workspace = true }
wgpu        = { workspace = true }
glam        = { workspace = true }
# Native (xdg-desktop-portal) Open / Save dialogs when a person runs the app.
rfd         = "0.17"

[dev-dependencies]
pollster = { workspace = true }
# The UI tests find widgets by their label, as a screen reader would.
eframe      = { workspace = true, features = ["accesskit"] }
loom_fbx = { workspace = true }
