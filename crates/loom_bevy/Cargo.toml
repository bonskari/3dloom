[package]
name    = "loom_bevy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loom_mesh   = { workspace = true }
loom_render = { workspace = true }
loom_scene  = { workspace = true }
glam        = { workspace = true }
wgpu        = { workspace = true }
image       = { workspace = true }
# Headless: no window, no audio, no winit. Runs on the UI's wgpu device.
bevy = { version = "0.16", default-features = false, features = ["std", "async_executor", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_window", "pbr_specular_textures"] }

# Tangent workers are parallel; Bevy retains the host-controlled ECS/render schedule.
bevy_tasks = { version = "0.16", features = ["multi_threaded"] }
bevy_mikktspace = "0.16.1"

[dev-dependencies]
serde_json = { workspace = true }
pollster = { workspace = true }
