name: build

# Only main: every verified commit is fast-forwarded there; building other
# branches too would only queue main behind them.
on:
  push:
    branches: [main]

# The nightly release step moves the tag and uploads the binaries.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: [self-hosted, 3dloom]
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p loom_app --bin loom
      - uses: actions/upload-artifact@v4
        with:
          name: loom-linux-x64
          path: target/release/loom
          retention-days: 14
      # Windows: cross-compiled on the same runner (x86_64-pc-windows-gnu, mingw-w64).
      - run: cargo build --release -p loom_app --bin loom --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: loom-windows-x64
          path: target/x86_64-pc-windows-gnu/release/loom.exe
          retention-days: 14
      # A rolling "nightly" release with both binaries: one stable link to share.
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-pc-windows-gnu/release/loom.exe loom-windows-x64.exe
          cp target/release/loom loom-linux-x64
          git tag -f nightly
          git push -f origin nightly
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease --title "3dLoom nightly" --notes "Newest build of main."
          gh release edit nightly --notes "Newest build of main: ${GITHUB_SHA::7}"
          gh release upload nightly loom-windows-x64.exe loom-linux-x64 --clobber
